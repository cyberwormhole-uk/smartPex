name: Build SmartPixels

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        run: |
          if [ -f SmartPixels.zip ]; then unzip -oq SmartPixels.zip; fi
          ls -la

      - name: Install build tools
        run: brew install make ldid dpkg

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build rootless package
        run: |
          DIR=.
          [ -f Makefile ] || DIR=SmartPixels
          cd "$DIR"
          gmake package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: SmartPixels-deb
          path: "**/packages/*.deb"
